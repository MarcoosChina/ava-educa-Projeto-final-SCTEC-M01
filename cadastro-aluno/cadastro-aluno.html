<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro-aluno.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script type="module" src="cadastro-aluno.js"></script>
    <title>Cadastro de Aluno</title>
</head>
<body>
    <header>
        <h1>AVA-EDUCA+</h1>
        <p id="nomeUsuario"></p>
    </header>
    <aside>
        <nav>
            <ul>
                <li>
                    <a href="../dashboard/dashboard.html">Dashboard</a>
                </li>
                <li>
                    Cursos
                </li>
                <li>
                    <a href="cadastro-aluno.html">Cadastro de alunos</a>
                </li>
            </ul>
            <button id="sair">Sair</button>
        </nav>
    </aside>
    <main>
        <section id="cadastro">
            <h2>Cadastro de Aluno</h2>
            <form id="formCadastroAluno">
                <div>
                    <label for="nomeCompleto">Nome Completo</label>
                    <input type="text" id="nomeCompleto" name="nomeCompleto" minlength="4" maxlength="80" required>
                </div>
                <div>
                    <label for="genero">Gênero</label>
                    <select id="genero" name="genero" required>
                        <option value="">Selecione</option>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                        <option value="outro">Outro</option>

                    </select>
                </div>
                <div>
                    <label for="dataNascimento">Data de Nascimento</label>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
                </div>
                <div>
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" inputmode="numeric" required>
                </div>
                <div>
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" inputmode="numeric" required>
                </div>
                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" inputmode="numeric" required>
                </div>
                <div>
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
                <div>
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" name="estado" required>
                </div>
                <div>
                    <label for="logradouro">Logradouro</label>
                    <input type="text" id="logradouro" name="logradouro" required>
                </div>
                <div>
                    <label for="numero">Número</label>
                    <input type="number" id="numero" name="numero" required>
                </div>
                <div>
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento">
                </div>
                <div>
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>
                <button type="submit">Salvar</button>
            </form>
        </section>
    </main>
</body>
</html>
