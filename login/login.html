<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <!-- o tipo está como modulo pela exigencia do RF12, por conta que trabalharei com export e import -->
    <script type="module" src = "login.js" defer></script>
    <title>Login AVA-EDUCA+</title>
</head>
<body>
    <main>
        <h1>Login AVA-EDUCA+</h1>
        <!-- deve ter Email, Senha, botão Entrar e o link “Esqueceu sua senha?”. -->
        <form id = "formLogin">
            <div>
                <label for = "email">E-mail</label>
                <input type="email" name="email" id="email" placeholder= "Digite seu email" required>

            </div>
            <div>
                <label>Senha</label>
                <input type="password" name="senha" id="senha" placeholder= "Digite sua senha" required>
            </div>
            <div>
                <button type="submit">Entrar</button>
            </div>
            <a href="#">Esqueceu sua senha?</a>

        </form>

    </main>
</body>
</html>
